spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/orders_database
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

topics:
  payment: "payment.process"


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html